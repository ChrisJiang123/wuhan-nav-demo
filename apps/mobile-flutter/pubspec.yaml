name: wuhan_nav
description: 武汉市内导航 Demo — 仅 Android，OSM + MapLibre 开源自搭客户端。
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  # 地图渲染：MapLibre GL（禁止商业地图 SDK）。
  maplibre_gl: ^0.26.2
  # 状态管理：本项目统一使用 Riverpod（首个 Flutter 任务锁定，后续不再更换）。
  flutter_riverpod: ^3.3.2
  # BFF HTTP 客户端（只调 map-bff，不直连底层）。
  http: ^1.4.0
  # DTO 与 packages/shared-types 镜像，不在前端重复定义。
  shared_types:
    path: ../../packages/shared-types/dart
  # mock 数据资产包（源文件在 packages/test-fixtures/，经 symlink 引用）。
  test_fixtures:
    path: ../../packages/test_fixtures
  # 定位（导航跟随）。
  geolocator: ^14.0.0
  # 运行时权限（通知等；定位也可由 geolocator 请求）。
  permission_handler: ^12.0.0
  # 导航态前台服务保活（Android）。
  flutter_foreground_task: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
